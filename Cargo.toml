[package]
name = "brubeck"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A RISC-V REPL and emulation library ... a work in progress!"
homepage = "https://github.com/peat/brubeck"
repository = "https://github.com/peat/brubeck"
readme = "README.md"
keywords = ["risc-v", "riscv"]
categories = ["emulators"]
include = ["**/*.rs", "Cargo.toml"]
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The library itself has zero dependencies. Everything below is optional and
# only pulled in by the `cli` feature, which builds the terminal REPL binary.
crossterm = { version = "0.29", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[features]
default = ["cli"]
# Build the interactive REPL binary. Disable with `--no-default-features`
# for library-only builds (WASM, embedded).
cli = ["dep:crossterm", "dep:clap"]

[[bin]]
name = "brubeck"
path = "src/bin/brubeck.rs"
required-features = ["cli"]
